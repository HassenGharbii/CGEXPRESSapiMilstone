services:
  db:
    image: postgres:16-alpine
    container_name: milestone-postgres
    environment:
      - POSTGRES_USER=milestone
      - POSTGRES_PASSWORD=milestone
      - POSTGRES_DB=milestone
      - PGPORT=6623
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "6623:6623"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milestone -d milestone -p 6623"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cgexpress-api:
    build: .
    container_name: cgexpress-api
    environment:
      - API_USERNAME=axone
      - API_PASSWORD=Ax0nesys!
      - SERVER_URL=http://192.168.20.1
      - VERIFY_CERTIFICATES=True
      - ENABLE_WEBSOCKET=true
      - EVENT_TYPE_FILTER=*
      - EVENT_SOURCE_FILTER=*
      - SYNC_INTERVAL_SECONDS=300
      - ALARM_SYNC_INTERVAL_SECONDS=15
      - DATABASE_URL=postgresql+psycopg2://milestone:milestone@db:6623/milestone
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
